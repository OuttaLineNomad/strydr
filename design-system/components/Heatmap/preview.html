  .day-label { fill: var(--ink-muted); font-size: 9px; font-family: var(--font-body); }
  .legend-row { display: flex; align-items: center; gap: 6px; margin-top: var(--space-3); font-size: 11px; color: var(--ink-muted); }
  .legend-swatches { display: flex; gap: 3px; }
  .legend-swatches span { width: 11px; height: 11px; border-radius: 3px; display: block; }
</style>

    const byKey = {};
    data.forEach(c => byKey[c.w + '_' + c.d] = c.mi);

    const svg = document.getElementById('svg');
    const tooltip = document.getElementById('tooltip');
    const plotWrap = document.getElementById('plotWrap');
    const ttDate = document.getElementById('ttDate');
    const ttVal = document.getElementById('ttVal');

    svg.querySelectorAll('.cell').forEach(cell => {
      const w = Number(cell.dataset.w), d = Number(cell.dataset.d);
      const mi = byKey[w + '_' + d];
      function show() {
        svg.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
        cell.classList.add('active');
        ttDate.textContent = 'Week ' + (13 - w) + ' ago, ' + dayNames[d];
        ttVal.textContent = mi === 0 ? 'Rest day' : mi + ' mi';
        tooltip.classList.add('visible');
        const scale = svg.clientWidth / 248;
        const x = Number(cell.getAttribute('x')) * scale;
        const left = Math.min(Math.max(x - 50, 0), plotWrap.clientWidth - 140);
        tooltip.style.left = left + 'px';
        tooltip.style.top = '4px';
      }
      cell.addEventListener('pointerenter', show);
      cell.setAttribute('tabindex', '0');
      cell.addEventListener('focus', show);
      cell.addEventListener('blur', () => { cell.classList.remove('active'); tooltip.classList.remove('visible'); });
    });
    svg.addEventListener('pointerleave', () => {
      svg.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
      tooltip.classList.remove('visible');
    });

    (function () {
      const toggle = document.getElementById('toggle');
      const table = document.getElementById('table');

      // Built with DOM methods and textContent, not innerHTML — series/date
      // labels are untrusted data in a real app (CSV headers, API responses),
      // so this is the pattern to copy, not string concatenation.
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      ['Week', ...dayNames].forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      for (let w = 0; w <= 12; w++) {
        const row = document.createElement('tr');
        const weekCell = document.createElement('td');
        weekCell.textContent = (13 - w) + ' wk ago';
        row.appendChild(weekCell);
        for (let d = 0; d < 7; d++) {
          const mi = byKey[w + '_' + d];
          const td = document.createElement('td');
          td.textContent = mi === 0 ? '—' : mi + ' mi';
          row.appendChild(td);
        }
        tbody.appendChild(row);
      }
      table.appendChild(tbody);

      let showingTable = false;
      toggle.addEventListener('click', () => {
        showingTable = !showingTable;
        table.hidden = !showingTable;
        plotWrap.hidden = showingTable;
        toggle.textContent = showingTable ? 'View as chart' : 'View as table';
        toggle.setAttribute('aria-pressed', String(showingTable));
      });
    })();

</html>
