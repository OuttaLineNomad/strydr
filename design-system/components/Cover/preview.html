<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Sora:wght@500&display=swap">
<style>
  html, body { margin: 0; }
  svg { display: block; width: 960px; height: 300px; }
  .ground   { fill: var(--surface-0); }
  .tint     { fill: var(--accent); opacity: .07; }
  .arc      { fill: none; stroke: var(--ink); stroke-linecap: round; }
  .slab     { fill: var(--accent); }
  .ink-block{ fill: var(--ink); }
  .cyan     { fill: var(--secondary); }
  .gold     { fill: var(--tertiary); }
  .name     { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; fill: var(--ink); }
  .tagline  { font-family: 'Sora', system-ui, sans-serif; font-weight: 500; fill: var(--ink-muted); }
</style>
</head>
<body>
<!--
  blocks: accent slab (radius-xl 32px) · secondary block (radius-lg 24px) ·
          tertiary disc (radius-full) · ink block (radius-lg 24px, 20px used) ·
          accent @ 7% tint for relief — 5 blocks, ~30% of the canvas
  arrangement: one dominant slab bleeding off the right edge, two smaller
          satellites stacked behind its left shoulder, all right of x=480
  pattern: concentric quarter-circle arcs anchored off the bottom-right
          corner — a running track's bend, the one literal motif this
          product has; drawn in ink at 6–10% so it reads as a track, not a
          radar sweep
  scales: space-6 (24px) left margin on the text block; radius-xl/radius-lg/
          radius-full for every rx; canvas 960x300
-->
<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="rightBox"><rect x="480" y="0" width="480" height="300" /></clipPath>
  </defs>

  <rect class="ground" x="0" y="0" width="960" height="300" />
  <rect class="tint" x="480" y="0" width="480" height="300" />

  <g clip-path="url(#rightBox)">
    <circle class="arc" cx="960" cy="340" r="420" stroke-width="16" opacity=".10" />
    <circle class="arc" cx="960" cy="340" r="330" stroke-width="14" opacity=".08" />
    <circle class="arc" cx="960" cy="340" r="240" stroke-width="12" opacity=".06" />
  </g>

  <rect class="ink-block" x="560" y="36" width="110" height="96" rx="20" />
  <rect class="cyan" x="556" y="160" width="130" height="112" rx="24" />
  <circle class="gold" cx="712" cy="68" r="30" />
  <rect class="slab" x="800" y="20" width="220" height="260" rx="32" />

  <text class="name" x="48" y="208" font-size="104" style="line-height:.94">Strydr</text>
  <text class="tagline" x="50" y="246" font-size="13.5">Your watch. Your server. Your coach.</text>
</svg>
</body>
</html>
