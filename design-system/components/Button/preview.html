<!-- @dsCard group="Controls" height=260 subtitle="Primary coral, glass, secondary and icon-only" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap">
<style>
  body { margin: 0; font-family: var(--font-body); color: var(--ink); padding: 28px; background: var(--surface-0); }
  .stage { display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: var(--ink-muted); width: 92px; flex-shrink: 0; }
  svg { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="row">
      <span class="label">Primary</span>
      <button class="btn btn-primary">Sync now</button>
      <button class="btn btn-primary" disabled>Sync now</button>
      <button class="btn btn-primary btn-icon" aria-label="Sync now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3.5M4 13a8 8 0 0 0 14.9 3.5"/><path d="M20 4v4h-4M4 20v-4h4"/></svg>
      </button>
    </div>
    <div class="row">
      <span class="label">Glass</span>
      <button class="btn btn-glass">Share route</button>
      <button class="btn btn-glass btn-sm">This week</button>
    </div>
    <div class="row">
      <span class="label">Secondary</span>
      <button class="btn btn-secondary">Cancel</button>
      <button class="btn btn-secondary" disabled>Cancel</button>
    </div>
  </div>
  <script>/* static control states — no interaction beyond :hover/:active/:focus-visible in CSS */</script>
</body>
</html>
