<!-- @dsCard group="Data" height=320 subtitle="Hero metric plus two supporting tiles, trend as a pill — no sparkline on the number itself" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Sora:wght@400;500;600&display=swap">
<style>
  body { margin: 0; font-family: var(--font-body); color: var(--ink); padding: 28px; background: var(--surface-0); }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: var(--space-4); }
  .tile { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); }
  .tile-label { font-size: 11px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: var(--ink-muted); }
  .hero-row { display: flex; align-items: baseline; gap: var(--space-2); }
  .hero { font-family: var(--font-display); font-size: 56px; line-height: 56px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .unit { font-size: 17px; font-weight: 600; color: var(--ink-secondary); }
  .sub-row { display: flex; align-items: center; }
  .small-grid { display: grid; gap: var(--space-4); }
  .metric-sm-num { font-family: var(--font-display); font-size: 28px; line-height: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pill-up svg, .pill-down svg { width: 11px; height: 11px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="tile glass">
      <span class="tile-label">This week</span>
      <div class="hero-row">
        <span class="hero">5.2</span>
        <span class="unit">mi</span>
      </div>
      <div class="sub-row">
        <span class="pill pill--success">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          +0.8 mi vs last week
        </span>
      </div>
    </div>
    <div class="small-grid">
      <div class="tile glass" style="padding: var(--space-4);">
        <span class="tile-label">Avg pace</span>
        <span class="metric-sm-num">8:42<span style="font-size:14px;color:var(--ink-secondary);font-family:var(--font-body);font-weight:500;">/mi</span></span>
      </div>
      <div class="tile glass" style="padding: var(--space-4);">
        <span class="tile-label">Elevation gain</span>
        <span class="metric-sm-num">412<span style="font-size:14px;color:var(--ink-secondary);font-family:var(--font-body);font-weight:500;"> ft</span></span>
      </div>
    </div>
  </div>
  <script>/* static — real tiles bind hero/metric-sm-num to live data */</script>
</body>
</html>
