<!-- @dsCard group="Foundations" height=300 subtitle="24px grid, 1.8px stroke, round caps and joins" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500&display=swap">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-0); padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px; border-radius: var(--radius-md); }
  .cell svg { width: 26px; height: 26px; color: var(--ink-secondary); }
  .cell span { font-size: 10.5px; font-weight: 500; color: var(--ink-muted); text-align: center; }
  svg { stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell">
      <svg viewBox="0 0 24 24" stroke-width="2.4"><line x1="6" y1="18" x2="6" y2="13"/><line x1="12" y1="18" x2="12" y2="7"/><line x1="18" y1="18" x2="18" y2="4"/></svg>
      <span>dashboard</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M9 3 4 5v16l5-2 6 2 5-2V3l-5 2-6-2Z"/><path d="M9 3v16M15 5v16"/></svg>
      <span>routes</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H9l-4 4v-4H6.5A2.5 2.5 0 0 1 4 13.5v-8Z"/></svg>
      <span>coach</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.9 3.1-6 7-6s7 2.1 7 6"/></svg>
      <span>profile</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3.5M4 13a8 8 0 0 0 14.9 3.5"/><path d="M20 4v4h-4M4 20v-4h4"/></svg>
      <span>sync</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg>
      <span>share</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M8 4h8v3a4 4 0 0 1-8 0V4Z"/><path d="M8 5H5.5A1.2 1.2 0 0 0 4.3 6.2 3 3 0 0 0 7 9M16 5h2.5a1.2 1.2 0 0 1 1.2 1.2A3 3 0 0 1 17 9"/><path d="M12 11v3"/><path d="M9 20h6"/><path d="M10.2 20v-1.5a1.8 1.8 0 0 1 3.6 0V20"/></svg>
      <span>pr / trophy</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l3 2"/><path d="M9.5 2.5h5M12 2.5V5"/></svg>
      <span>pace</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M12 19.5s-7.5-4.6-9.3-9.4C1.6 6.9 3.4 4 6.5 4c2 0 3.4 1.2 4 2.3.6-1.1 2-2.3 4-2.3 3.1 0 4.9 2.9 3.8 6.1C19.5 14.9 12 19.5 12 19.5Z"/></svg>
      <span>heart rate</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M3 18 9 8l4 6 2-3 6 7H3Z"/></svg>
      <span>elevation</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><ellipse cx="9" cy="7" rx="2.3" ry="3.2" transform="rotate(-15 9 7)"/><ellipse cx="15" cy="17" rx="2.3" ry="3.2" transform="rotate(15 15 17)"/></svg>
      <span>cadence</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M13 3 5 14h5l-1 7 8-11h-5l1-7Z"/></svg>
      <span>power</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16 16 9"/><circle cx="12" cy="16" r="1.3" fill="currentColor" stroke="none"/></svg>
      <span>speed</span>
    </div>
  </div>
  <script>/* static reference sheet — copy inline markup from the README */</script>
</body>
</html>
