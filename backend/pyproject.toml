[project]
name = "strydr"
version = "0.1.0"
license = "MIT"
description = "Self-hosted running analytics"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.162.*",
  "pydantic==2.14.*",
  "uvicorn==0.54.*",
  "sqlalchemy==2.1.6",
  "alembic==1.20.*",
  "sqlcipher3==0.6.4",
  "ijson==3.6.*",
  "argon2-cffi==25.1.*",
  "shapely==2.2.*",
  "numpy==2.5.*",
  "httpx==0.28.*",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest",
]

[project.scripts]
strydr = "strydr.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strydr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: large-payload tests"]
